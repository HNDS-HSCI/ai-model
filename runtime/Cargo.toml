[workspace]
members = [
    "crates/brain_kernel",
    "crates/reasoning",
    "crates/tool_executor"
]
resolver = "2"

[workspace.package]
version = "5.0.0"
edition = "2021"
authors = ["HSCI Core Team"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
