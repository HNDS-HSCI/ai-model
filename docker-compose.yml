services:
  hsci-mind:
    build: .
    ports:
      - "8000:8000"
    environment:
      - HSCI_MIND_DB=/app/data/hsci_mind.db
    volumes:
      - mind_data:/app/data          # learned knowledge and experience persist across restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v2/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mind_data:
