[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hsci"
version = "0.2.0-alpha"
description = "HSCI Mind: a small reasoner that is taught concepts in English and by example, and proves its answers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.7.0",
    "z3-solver>=4.12.2.0",
    "sympy>=1.12",
    "numpy>=1.26.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
neural = ["sentence-transformers>=3.0"]
test = ["pytest>=8.0"]

[project.scripts]
hsci-app = "run_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hsci*"]

[tool.pytest.ini_options]
testpaths = ["hsci/tests"]
