name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HSCI_MIND_ENCODER: hash   # no model download in CI
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi "uvicorn[standard]" pydantic z3-solver sympy numpy pytest
        pip install torch --index-url https://download.pytorch.org/whl/cpu
    - name: Compile
      run: python -m compileall -q hsci brain_api.py run_app.py
    - name: Tests
      run: python -m pytest -q
    - name: Reasoning evaluation (fresh invented words)
      run: python -m hsci.mind.evaluation --n 10 --seed 1
